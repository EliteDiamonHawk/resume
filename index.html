<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Document</title>

    <script>
        const params = new URLSearchParams(window.location.search);

        if (params.get("format") === "html") {
            window.location.replace(
                "https://github.com/EliteDiamonHawk/resume/blob/main/resume/resume.html"
            );
        }
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f6f8fa;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .viewer-container {
            flex-grow: 1;
            width: 100%;
            height: calc(100vh - 70px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .fallback-message {
            padding: 40px;
            text-align: center;
        }
    </style>
</head>
<body>

<main class="viewer-container">
    <iframe src="https://elitediamonhawk.github.io/resume/resume/resume.pdf">
        <div class="fallback-message">
            <p>This browser does not support embedded pages.</p>
            <a href="https://elitediamonhawk.github.io/resume/resume/resume.pdf" target="_parent">
                Click here to view the resume.
            </a>
        </div>
    </iframe>
</main>

</body>
</html>
