name: Deploy GitHub Pages

on:
  # Only deploy when manually triggered from GitHub Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clear previous deployment history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --paginate \
            "repos/${{ github.repository }}/deployments?environment=github-pages" \
            --jq '.[].id' |
          while read -r deployment_id; do
            echo "Deleting deployment $deployment_id"

            gh api \
              --method POST \
              "repos/${{ github.repository }}/deployments/$deployment_id/statuses" \
              -f state=inactive

            gh api \
              --method DELETE \
              "repos/${{ github.repository }}/deployments/$deployment_id"
          done

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
